{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "secretly.fullname" . }}
  namespace: {{ .Values.namespace | default "secretly" }}
  labels:
    {{- include "secretly.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "secretly.selectorLabels" . | nindent 6 }}
  policyTypes:
    {{- toYaml .Values.networkPolicy.policyTypes | nindent 4 }}
  {{- $scrape := and .Values.monitoring.enabled .Values.monitoring.serviceMonitor.enabled }}
  {{- if or .Values.networkPolicy.ingress $scrape }}
  ingress:
    {{- with .Values.networkPolicy.ingress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if $scrape }}
    # Let Prometheus scrape /metrics
    - from:
        - namespaceSelector:
            {{- toYaml .Values.monitoring.serviceMonitor.prometheusNamespaceSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: http
    {{- end }}
  {{- end }}
  {{- if .Values.networkPolicy.egress }}
  egress:
    {{- toYaml .Values.networkPolicy.egress | nindent 4 }}
  {{- end }}
{{- end }}