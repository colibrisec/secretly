name: Build and Push Docker Images

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (tags, labels)
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=raw,value=latest,enable={{is_default_branch}}
          type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

    - name: Build and push Docker image
      id: build
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64,linux/arm64

    - name: Scan image with ojo
      uses: colibrisec/ojo-action@a96f5b8e59824026140fc96ecc72adcd099f8d24 # main (adds sarif-omit-suppressed)
      with:
        ojo-version: 'v0.2.4'
        sarif-omit-suppressed: 'true'
        vulnerabilities: 'false'
        secrets: 'false'
        iac: 'false'
        sast: 'false'
        image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}

    - name: Upload to Balam
      if: ${{ always() && hashFiles('ojo-image-report.json') != '' }}
      uses: colibrisec/balam-action@88a6df7e085a860ea6d11719789bb197807c0402 # v1
      with:
        file: ojo-image-report.json
        scan-type: 'OJO Scan'
        balam-url: ${{ secrets.BALAM_URL }}
        balam-token: ${{ secrets.BALAM_TOKEN }}
        product-name: secretly
        engagement-name: 'Container Images'
