name: ci

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test with coverage
        run: npm run test:ci
      - name: Build
        run: npm run build
      - name: Test release scripts
        run: bash scripts/next-version.test.sh
      - name: Coverage report
        uses: getsentry/codecov-action@5f3f449cf9e909fd63513a48f27c57f090a5f321 # v0.4.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          post-pr-comment: true
      - name: Keep coverage summary for the badge
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json

  coverage-badge:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: coverage-badge
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: coverage-summary
          path: coverage
      - name: Render badge
        run: node scripts/coverage-badge.mjs coverage/coverage-summary.json coverage.svg
      - name: Publish badge to the wiki
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.wiki.git" wiki
          cp coverage.svg wiki/coverage.svg
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage.svg
          if git diff --cached --quiet; then
            echo "badge unchanged"
          else
            git commit -m "Update coverage badge"
            git push
          fi
